spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:sarc}?currentSchema=sarc_users
    username: ${DB_USER:sarc}
    password: ${DB_PASSWORD:sarc}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: sarc_users
  flyway:
    enabled: true
    schemas: sarc_users
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_EXTERNAL_URL:http://localhost:8090}/realms/sarc
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://keycloak:8080}/realms/sarc/protocol/openid-connect/certs

server:
  port: 8082
