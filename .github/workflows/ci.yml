name: CI — Build e Testes

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Testes Unitários e de Integração
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21 (LTS)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar e executar testes — user-service
        run: mvn -pl user-service test -B

      - name: Compilar e executar testes — resource-service
        run: mvn -pl resource-service test -B

      - name: Compilar e executar testes — allocation-service
        run: mvn -pl allocation-service test -B

      - name: Compilar e executar testes — schedule-service
        run: mvn -pl schedule-service test -B

      - name: Gerar relatórios de cobertura JaCoCo
        run: mvn -pl user-service,resource-service,allocation-service verify -DskipTests -B

      - name: Scan de vulnerabilidades OWASP — user-service
        run: mvn -pl user-service org.owasp:dependency-check-maven:check -B
        continue-on-error: true

      - name: Scan de vulnerabilidades OWASP — resource-service
        run: mvn -pl resource-service org.owasp:dependency-check-maven:check -B
        continue-on-error: true

      - name: Scan de vulnerabilidades OWASP — allocation-service
        run: mvn -pl allocation-service org.owasp:dependency-check-maven:check -B
        continue-on-error: true

      - name: Upload relatório JaCoCo — user-service
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-user-service
          path: user-service/target/site/jacoco/

      - name: Upload relatório JaCoCo — resource-service
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-resource-service
          path: resource-service/target/site/jacoco/

      - name: Upload relatório JaCoCo — allocation-service
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-allocation-service
          path: allocation-service/target/site/jacoco/

      - name: Upload relatórios Surefire (falhas de teste)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: |
            user-service/target/surefire-reports/
            resource-service/target/surefire-reports/
            allocation-service/target/surefire-reports/
            schedule-service/target/surefire-reports/
