spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # create-drop garante schema limpo a cada teste
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    # Sem default_schema para user-service: Usuario.java usa @Table(name="usuario") sem schema explícito
    # O Hibernate criará a tabela no schema PUBLIC do H2, que é o padrão
    show-sql: false
  flyway:
    enabled: false
